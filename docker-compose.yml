services:
  engine:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: gemini_engine
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: python main.py serve --host 0.0.0.0 --port 8000
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
    networks:
      - sec-network
    depends_on:
      juice-shop:
        condition: service_healthy

  # 실전형 취약점 테스트베드: OWASP Juice Shop
  juice-shop:
    image: bkimminich/juice-shop
    container_name: gemini_juice_shop
    restart: always
    ports:
      - "3000:3000"
    networks:
      - sec-network
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://localhost:3000', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); })"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sec-network:
    driver: bridge